[project]
name = "support-ticket-agent"
version = "0.1.0"
description = "Agent that classifies support tickets, prioritizes them, drafts simple replies, and escalates uncertain cases"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
support-ticket-agent = "support_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
